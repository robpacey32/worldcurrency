name: 🪙 Numista API Ingest

on:
  workflow_dispatch:
  #schedule:
    #- cron: "0 5 1 * *"   # 05:00 UTC on the 1st of each month

jobs:
  run-numista-api-ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write GCP credentials file
        run: |
          echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}' > key.json

      - name: Run Numista API ingest
        env:
          GOOGLE_APPLICATION_CREDENTIALS: key.json
          NUMISTA_API_KEYS: ${{ secrets.NUMISTA_API_KEYS }}
        run: |
          python API_DataPull/numista_api_ingest.py
